apply plugin: 'com.android.application'

android {
    namespace "com.primegram.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.primegram.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt((project.findProperty("appBuild") ?: "1").toString())
        versionName "1.0.${project.findProperty("appBuild") ?: "0"}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing. Order of precedence:
    //   1. android/keystore.properties  (local machine, git-ignored)  -> your permanent release key
    //   2. PRIMEGRAM_KEYSTORE_* env vars (GitHub Actions secrets)
    //   3. the legacy key committed in the repo, ONLY so existing installs can still upgrade until the new key is in place.
    // Android only accepts an in-place upgrade when the new APK is signed with the same key as the installed one.
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file("keystore.properties")
    if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            } else if (System.getenv("PRIMEGRAM_KEYSTORE_FILE")) {
                storeFile file(System.getenv("PRIMEGRAM_KEYSTORE_FILE"))
                storePassword System.getenv("PRIMEGRAM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PRIMEGRAM_KEY_ALIAS") ?: "primegram"
                keyPassword System.getenv("PRIMEGRAM_KEY_PASSWORD")
            } else {
                logger.warn("WARNING: no keystore.properties / secrets found - signing with the legacy in-repo key.")
                storeFile file("primegram.keystore")
                storePassword "primegram-keystore"
                keyAlias "primegram"
                keyPassword "primegram-keystore"
            }
        }
        // Debug builds keep the legacy key so debug installs upgrade over each other.
        primegram {
            storeFile file("primegram.keystore")
            storePassword "primegram-keystore"
            keyAlias "primegram"
            keyPassword "primegram-keystore"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.primegram
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// Capacitor's Android dependency graph can bring both the merged Kotlin
// standard library and the legacy jdk7/jdk8 split artifacts. Keep the merged
// library and exclude the legacy duplicates so Gradle can package the APK.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
