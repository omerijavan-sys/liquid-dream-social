    <style>
      .primegram-startup{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 38%,rgba(65,105,225,.18),transparent 42%),#080b14;color:#f8fafc;font-family:Inter,system-ui,sans-serif}

      .primegram-startup p{margin:0;font-size:16px;font-weight:800;letter-spacing:.18em}
      .primegram-startup p span{color:#93c5fd}
      .primegram-startup__track{width:min(220px,60vw);height:3px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.12)}
      .primegram-startup__track span{display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#60a5fa,#c4b5fd);animation:primegram-load 1.25s ease-in-out infinite}

      @media(prefers-reduced-motion:reduce){.primegram-startup__track span{animation:none;width:100%}}
