name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Smoke test (app must mount without crashing)
        run: npx vitest run src/test/appSmoke.test.tsx

      - name: Add Firebase config (enables phone notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ] && echo "$GOOGLE_SERVICES_JSON" | grep -q '"package_name": *"com.primegram.app"'; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "VITE_PUSH_ENABLED=true" >> "$GITHUB_ENV"
            echo "google-services.json added - push enabled"
          elif grep -q '"package_name": *"com.primegram.app"' android/app/google-services.json 2>/dev/null; then
            echo "VITE_PUSH_ENABLED=true" >> "$GITHUB_ENV"
            echo "Using google-services.json from the repo - push enabled"
          else
            echo "No valid google-services.json (package must be com.primegram.app) - push disabled in this build"
          fi

      - name: Build web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://nrtvvddlnreqskzqksss.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_162c4qCCxAvlUjAXeczauw_ir2m2XwI
          VITE_SUPABASE_PROJECT_ID: nrtvvddlnreqskzqksss
          VITE_APP_BUILD: ${{ github.run_number }}

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Use signing key from secrets (if configured)
        env:
          KS_B64: ${{ secrets.PRIMEGRAM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/primegram.keystore"
            echo "PRIMEGRAM_KEYSTORE_FILE=$RUNNER_TEMP/primegram.keystore" >> "$GITHUB_ENV"
            echo "PRIMEGRAM_KEYSTORE_PASSWORD=${{ secrets.PRIMEGRAM_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "PRIMEGRAM_KEY_PASSWORD=${{ secrets.PRIMEGRAM_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "PRIMEGRAM_KEY_ALIAS=${{ secrets.PRIMEGRAM_KEY_ALIAS || 'primegram' }}" >> "$GITHUB_ENV"
            echo "Using signing key from repository secrets"
          else
            echo "No signing secrets set; using the key bundled in the repo"
          fi

      - name: Build APK
        run: |
          cd android
          set -o pipefail
          ./gradlew assembleRelease -PappBuild=${{ github.run_number }} --stacktrace --no-daemon 2>&1 | tee ../gradle-build.log || {
            grep -E "error:|\.java:[0-9]+|What went wrong|Execution failed|AAPT|Caused by|not found|Duplicate" -A3 ../gradle-build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/primegram.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: primegram-apk
          path: android/app/build/outputs/apk/release/primegram.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/release/primegram.apk
          tag_name: v${{ github.run_number }}
          name: Primegram APK Build ${{ github.run_number }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
