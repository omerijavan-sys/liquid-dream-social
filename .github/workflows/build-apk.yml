name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build web assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://kfvoqwbfgptqrrkyhorj.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_yFGklkV-V-QEFX7i8bWnbw_TvK-v02f
          VITE_SUPABASE_PROJECT_ID: kfvoqwbfgptqrrkyhorj
          VITE_APP_BUILD: ${{ github.run_number }}

      - name: Add Firebase config (enables phone notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; echo "google-services.json added"; else echo "No GOOGLE_SERVICES_JSON secret - push notifications disabled in this build"; fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: primegram-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v${{ github.run_number }}
          name: Primegram APK Build ${{ github.run_number }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK to the website download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk public/primegram-extreme.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/primegram-extreme.apk
          if git diff --cached --quiet; then echo "No APK change"; else
            git commit -m "Update Android APK download [skip actions]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
